name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir src
          unzip -q GameBoxAndroid.zip -d src
          echo "PROJ=$(dirname $(find src -name settings.gradle | head -1))" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build
        run: cd "$PROJ" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GameBox-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
